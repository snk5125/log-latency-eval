# =============================================================================
# playbooks/site.yml — full configuration of ALL llt hosts (deploy-once)
# =============================================================================
# WHY: PLAN §7 states "infrastructure is deployed once for all 48 runs" and
# "scenario switching is config-only". site.yml therefore installs and baselines
# EVERYTHING (packages, time sync, generator, agents, aggregators, Cribl) but
# leaves per-scenario wiring to configure-scenario.yml. Services that must be
# orchestrator-controlled (the event generator) are installed STOPPED/DISABLED.
#
# CONNECTION MODEL (PLAN §4.2 — SSM only, no SSH/WinRM):
#   Linux   -> connection: aws_ssm, shell: sh
#   Windows -> connection: aws_ssm, shell: powershell
#   The aws_ssm plugin brokers a file transfer through the artifacts S3 bucket,
#   so every host group sets ansible_aws_ssm_bucket_name. Values below are the
#   connection vars the plugin needs; they are commented inline.
# =============================================================================
---

# -----------------------------------------------------------------------------
# PLAY 0: OS-level connection vars applied to the whole run.
# We set connection vars at play level (not in inventory) so the single dynamic
# inventory file stays account-agnostic. os_linux vs os_windows groups come from
# the Os tag keyed_group (inventories/aws_ec2.yml).
# -----------------------------------------------------------------------------
- name: Baseline all Linux hosts (common + time-sync)
  hosts: os_linux
  gather_facts: true
  # aws_ssm connects as ssm-user, not root (C1) — escalate for all Linux tasks.
  become: true
  vars:
    # --- aws_ssm connection vars (Linux) -------------------------------------
    ansible_connection: aws_ssm
    ansible_shell_type: sh
    # Artifacts bucket brokers file transfer for SSM (PLAN §4.3 llt-artifacts).
    # Supplied via extra-vars / group_vars at deploy time; env fallback here.
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    # Sender-account hosts require the sender profile for the SSM session; the
    # orchestrator exports the matching profile per account before running.
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: common          # base pkgs, python3, disable unattended-upgrades
    - role: time-sync       # chrony -> 169.254.169.123 only (PLAN §5.3)

- name: Baseline all Windows hosts (common + time-sync)
  hosts: os_windows
  gather_facts: true
  # Windows aws_ssm sessions already run as SYSTEM — no become (stays become-free).
  vars:
    # --- aws_ssm connection vars (Windows) -----------------------------------
    ansible_connection: aws_ssm
    # PLAN requirement: Windows via aws_ssm with PowerShell shell.
    ansible_shell_type: powershell
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: common
    - role: time-sync       # w32time SpecialPollInterval -> AWS Time Sync

# -----------------------------------------------------------------------------
# PLAY 1: Event generator on ALL generator hosts (Linux + Windows).
# Installed STOPPED/DISABLED — the orchestrator starts it per-run via SSM
# (PLAN §4.2). Targets role_generator regardless of OS; the role branches
# on ansible_os_family.
# -----------------------------------------------------------------------------
- name: Install event generator on generator hosts (stopped/disabled)
  hosts: role_generator
  gather_facts: true
  # Mixed OS play: escalate only for Linux members (aws_ssm connects as
  # ssm-user there, C1); Windows aws_ssm sessions already run as SYSTEM.
  # Keyed off inventory group membership (M9), not gathered facts, so this
  # is stable even if the fact cache is stale mid-matrix.
  become: "{{ 'os_linux' in group_names }}"
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: "{{ 'powershell' if 'os_windows' in group_names else 'sh' }}"
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: event-generator

# -----------------------------------------------------------------------------
# PLAY 2: Vector AGENT on the Vector-stack generator hosts.
# Group intersection: role_generator AND stack_vector. Ansible has no native
# AND-of-groups target, so we target role_generator and guard the role with a
# when: on llt_stack. (Alternative: a Terraform-side composite tag; we keep the
# raw tags per PLAN §7 and filter here.)
# -----------------------------------------------------------------------------
- name: Install Vector agent on Vector-stack generator hosts
  hosts: role_generator
  gather_facts: true
  # Mixed OS play — see become rationale above (C1/M9).
  become: "{{ 'os_linux' in group_names }}"
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: "{{ 'powershell' if 'os_windows' in group_names else 'sh' }}"
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: vector-agent
      when: llt_stack == 'vector'

# -----------------------------------------------------------------------------
# PLAY 3: Cribl Edge on the Cribl-stack generator hosts.
# -----------------------------------------------------------------------------
- name: Install Cribl Edge on Cribl-stack generator hosts
  hosts: role_generator
  gather_facts: true
  # Mixed OS play — see become rationale above (C1/M9).
  become: "{{ 'os_linux' in group_names }}"
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: "{{ 'powershell' if 'os_windows' in group_names else 'sh' }}"
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: cribl-edge
      when: llt_stack == 'cribl'

# -----------------------------------------------------------------------------
# PLAY 4: Vector AGGREGATOR on Vector-stack tier-1 + tier-2 nodes (Linux).
# role_agg_t1 / role_agg_t2 come from the Role tag. These live in the LOGGING
# account, so llt_ssm_profile must resolve to the logging profile for this play.
# -----------------------------------------------------------------------------
- name: Configure Vector aggregators (tier-1 and tier-2)
  hosts: role_agg_t1:role_agg_t2
  gather_facts: true
  # Aggregator fleet is Linux-only (PLAN §4.3) — plain become (C1).
  become: true
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: sh
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: vector-aggregator
      when: llt_stack == 'vector'

# -----------------------------------------------------------------------------
# PLAY 5: Cribl Stream LEADER (logging account, single node).
# Must run before workers so workers have a leader to join.
# -----------------------------------------------------------------------------
- name: Configure Cribl Stream leader
  hosts: role_leader
  gather_facts: true
  # Leader host is Linux-only (PLAN §4.3) — plain become (C1).
  become: true
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: sh
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: cribl-leader
      when: llt_stack == 'cribl'

# -----------------------------------------------------------------------------
# PLAY 6: Cribl Stream WORKERS (worker groups t1/t2). Join the leader.
# -----------------------------------------------------------------------------
- name: Configure Cribl Stream workers (groups t1/t2)
  hosts: role_agg_t1:role_agg_t2
  gather_facts: true
  # Aggregator fleet is Linux-only (PLAN §4.3) — plain become (C1).
  become: true
  vars:
    ansible_connection: aws_ssm
    ansible_shell_type: sh
    ansible_aws_ssm_bucket_name: "{{ llt_artifacts_bucket }}"
    ansible_aws_ssm_region: "{{ llt_aws_region }}"
    ansible_aws_ssm_profile: "{{ llt_ssm_profile | default(omit) }}"
  roles:
    - role: cribl-worker
      when: llt_stack == 'cribl'

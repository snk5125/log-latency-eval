# =============================================================================
# requirements.yml — Ansible Galaxy collection dependencies (llt)
# =============================================================================
# WHY these collections:
#   - amazon.aws       : aws_ec2 dynamic inventory plugin + aws_ssm connection
#                        plugin (PLAN §4.2 SSM-only management), aws_s3 for
#                        artifact fetch, and general AWS module coverage.
#   - community.aws    : supplemental AWS modules (SQS, misc) not yet promoted
#                        into amazon.aws; used opportunistically by roles.
#   - ansible.windows  : Windows Server 2022 generator hosts — win_service,
#                        win_shell, win_package, w32tm/registry management for
#                        time-sync (PLAN §5.3) and Vector/Cribl Windows installs.
#   - community.windows: NSSM service wrapping + scheduled-task helpers for the
#                        event generator on Windows (event-generator role).
#   - community.general: general-purpose module coverage used opportunistically
#                        (e.g. filesystem/service helpers not in ansible.builtin);
#                        also the common home for extra Jinja filters some roles
#                        may lean on beyond the builtin password_hash filter.
#   - ansible.posix    : POSIX-y helpers (e.g. synchronize/mount/sysctl-style
#                        modules) used opportunistically on the Linux estate.
#
# Versions are PINNED (PLAN §7: "collections pinned"). Exact deployed versions
# are recorded as report evidence. Install with:
#   ansible-galaxy collection install -r requirements.yml
# =============================================================================
---
collections:
  # aws_ec2 inventory + aws_ssm connection + aws_s3 module.
  - name: amazon.aws
    version: "9.5.0"

  # Supplemental AWS modules (SQS, etc.).
  - name: community.aws
    version: "9.0.0"

  # Windows core modules (win_service, win_package, win_shell, win_regedit).
  - name: ansible.windows
    version: "3.1.0"

  # Windows community modules (win_nssm for wrapping eventgen.py as a service).
  - name: community.windows
    version: "3.0.0"

  # General-purpose module coverage (m5 — referenced opportunistically by
  # ansible-lint's default rule set and general Linux role coverage).
  - name: community.general
    version: "9.0.0"

  # POSIX helpers for the Linux estate (m5).
  - name: ansible.posix
    version: "1.5.4"

# =============================================================================
# ansible.cfg — Logging Latency Test (llt) Ansible control config
# =============================================================================
# WHY this file exists in the experiment:
#   All hosts in the sender + logging accounts are reachable ONLY via AWS SSM
#   (PLAN §4.2: "No SSH/WinRM ingress. Ansible uses the aws_ssm connection
#   plugin with an artifacts S3 bucket for file transfer."). These defaults
#   make the aws_ssm connection plugin the path of least surprise and keep the
#   inventory/roles discoverable from the ansible/ root.
# =============================================================================

[defaults]
# Where the dynamic inventory configs live (tag-based EC2 discovery). This is a
# DIRECTORY: Ansible loads both sender.aws_ec2.yml and logging.aws_ec2.yml and
# unions the hosts, so one run covers both AWS accounts (see inventories/README).
inventory = inventories/

# Roles are resolved relative to this dir first, then the playbooks dir.
roles_path = roles

# YAML stdout callback: readable task diffs/registered-var dumps. The clock
# assertion play (assert-clocks.yml) prints parsed chrony/w32tm values that are
# far easier to eyeball as YAML than as the default single-line dict.
stdout_callback = yaml

# Show task timing + a run recap; useful when correlating config pushes with
# per-run evidence (PLAN §5.3 records assertion values as run evidence).
callbacks_enabled = profile_tasks, timer

# HOST KEY CHECKING RATIONALE:
#   Set to False because the aws_ssm connection plugin does NOT use SSH host
#   keys at all — the session is brokered by AWS Systems Manager over TLS and
#   identity is established by IAM, not by an SSH known_hosts fingerprint.
#   Leaving strict host key checking on would cause spurious prompts/failures
#   for the (few) modules that still consult SSH settings, even though no SSH
#   transport is ever used on these SSM-only hosts (PLAN §4.2).
host_key_checking = False

# Interpreter is explicit per-OS in inventory/group_vars; silence auto-discovery
# warnings on Amazon Linux 2023 (python3) hosts.
interpreter_python = auto_silent

# Fact gathering is expensive over SSM; gather smart and cache within a run.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/llt_ansible_fact_cache
fact_caching_timeout = 3600

# Keep SSM sessions from stacking up; the matrix is small (a handful of hosts).
forks = 10

# Retry files clutter the repo and can leak host identifiers into git.
retry_files_enabled = False

# Deprecation noise off — collections are version-pinned in requirements.yml.
deprecation_warnings = True
command_warnings = False

[inventory]
# Fail loudly if the aws_ec2 plugin can't parse the inventory (bad creds,
# wrong region) rather than silently returning an empty host list.
enable_plugins = amazon.aws.aws_ec2
unparsed_is_failed = True
cache = True
cache_plugin = jsonfile
cache_connection = /tmp/llt_ansible_inv_cache
cache_timeout = 600

[ssh_connection]
# aws_ssm does not use SSH, but pipelining defaults here are harmless and keep
# any incidental local connections fast. No ControlPersist for SSM sessions.
pipelining = True

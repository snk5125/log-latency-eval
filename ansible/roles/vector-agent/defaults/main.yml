# =============================================================================
# roles/vector-agent/defaults/main.yml
# =============================================================================
# WHY: Vector is one of the two forwarding agents on generator hosts (PLAN §3).
# It tails the generator output file, stamps hop_ts.agent, and forwards to the
# aggregator (S1/S2 HTTP NDJSON) or to landing S3 (S3/S4). PARITY with Cribl
# Edge (role cribl-edge) is the point: identical hop_ts field name, identical
# NDJSON-over-HTTP transport (PLAN §4.4), identical S3 batch constants (PLAN §4.5).
---
# --- PINNED Vector version -------------------------------------------------
# Pinned to a real, recent Vector release. WHY pin: PLAN §7 requires version
# pinning and recording the EXACT deployed version as report evidence. The
# deployed binary's `vector --version` output is captured to run evidence at
# deploy time; this default is the intended/target version.
vector_version: "0.49.0"

# Download roots. Linux uses the official tar.gz; Windows uses the zip.
vector_download_base: "https://packages.timber.io/vector/{{ vector_version }}"
vector_linux_arch: "x86_64-unknown-linux-gnu"     # m6i.large = x86_64
vector_win_arch: "x86_64-pc-windows-msvc"

# Install/config paths.
vector_dir_linux: /opt/vector
vector_config_linux: /etc/vector/vector.yaml
vector_dir_win: C:\Program Files\Vector
vector_config_win: C:\ProgramData\Vector\vector.yaml
vector_service_name: vector
# Control-node temp path for the LOCALLY-rendered Windows config (configure.yml
# renders here with ansible.builtin.template, then win_copy ships it — win_template
# over aws_ssm was writing the raw unrendered .j2). Per-host to avoid collisions
# when the two Windows generators are configured in the same run.
vector_config_win_render_tmp: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) | regex_replace('/$', '') }}/llt-vector-{{ inventory_hostname }}.yaml"

# --- Source: generator output file to tail (PLAN §5.2 gen->agent hop) -------
# Path used by win_* MODULES (fetch/copy/service management) — backslashes are
# correct here; this is NOT rendered into config-file content (C11).
vector_source_path_linux: /opt/llt/generator/out/events.ndjson
vector_source_path_win: C:\llt\generator\out\events.ndjson
# Forward-slash form of the same path, for use ONLY inside rendered config
# content (vector.yaml.j2 `include:`). Windows parsers (Vector/Cribl/JSON) are
# fine with forward slashes, but backslashes inside a double-quoted YAML/JSON
# scalar produce illegal escapes (\l, \o, \u -> \u is especially dangerous:
# looks like a unicode escape) and the config is rejected (C11 fix).
vector_source_path_win_fwd: "C:/llt/generator/out/events.ndjson"

# --- Scenario wiring (injected per run by configure-scenario) --------------
# scenario ∈ s1|s2|s3|s4 controls the sink (PLAN §2):
#   S1/S2 -> http sink NDJSON to Tier-1 NLB :8080
#   S3/S4 -> aws_s3 sink to the landing bucket
scenario: "s1"

# --- Cross-pairing (C10) ----------------------------------------------------
# CRITICAL: the agent targets the CELL's aggregator, not its own stack's. A
# Vector agent running in a Cribl-aggregator cell (aggregator=cs) must still
# send to the Cribl worker t1 NLB / Cribl landing bucket, and vice versa. The
# `aggregator` extra-var (vagg|cs) is passed by the orchestrator per run
# (harness/orchestrator/run_matrix.py); default to 'vagg' so site.yml (which
# runs without that extra-var) still renders.
aggregator: "vagg"

# Tier-1 aggregator NLB DNS names — HTTP target for S1/S2. Both stacks' NLB
# names are populated from generated_infra.yml at deploy time (Terraform
# outputs); llt_t1_endpoint below selects the correct one for this cell.
vector_agg_t1_nlb: "llt-vagg-t1-nlb.internal.invalid"
cribl_edge_agg_t1_nlb: "llt-cs-t1-nlb.internal.invalid"
vector_agg_t1_port: 8080                 # Tier-1 listens :8080 (PLAN §4.4), both stacks
# Selected T1 HTTP endpoint for THIS cell (C10) — use in vector.yaml.j2 sinks,
# not vector_agg_t1_nlb directly.
llt_t1_endpoint: "{{ vector_agg_t1_nlb if (aggregator | default('vagg')) == 'vagg' else cribl_edge_agg_t1_nlb }}"

# Landing buckets for S3/S4 — both stacks' bucket names populated from
# generated_infra.yml; llt_landing_bucket below selects the correct one.
vector_landing_bucket: "llt-landing-vagg-REPLACE"
cribl_edge_landing_bucket: "llt-landing-cs-REPLACE"
# Selected landing bucket for THIS cell (C10) — use in vector.yaml.j2 sinks,
# not vector_landing_bucket directly.
llt_landing_bucket: "{{ vector_landing_bucket if (aggregator | default('vagg')) == 'vagg' else cribl_edge_landing_bucket }}"

vector_aws_region: "{{ llt_aws_region | default('us-east-2') }}"

# --- Batch constants — CONTROLLED CONSTANT (PLAN §4.5) ----------------------
# S3 sinks everywhere: 5 s timeout, 10 MB max. Identical to Cribl (parity).
vector_s3_batch_timeout_secs: 5
vector_s3_batch_max_bytes: 10485760      # 10 MB
# (Inter-aggregator HTTP batch is 1 s but that lives in the aggregator role.)

# --- Low-latency tuning profile (PLAN §4.6) — see docs/TUNING.md -----------
# Item 1: file source discovery-poll floor. glob_minimum_cooldown_ms is the
# delay between file-DISCOVERY calls (new files matching the glob), not the
# read latency of an already-open/tailed file (that path is OS
# notify-driven — inotify on Linux, ReadDirectoryChangesW-backed on Windows —
# and has no separate poll-interval knob in Vector 0.49). Floored from the
# 1000 ms default to 10 ms: the generator output file is a fixed single path
# (not globbed rotation) so this only affects how fast Vector notices the
# file the FIRST time it appears after a truncate/rotate (see item 1 decision
# note in vector.yaml.j2 re: read_from). Vendor doc:
# https://vector.dev/docs/reference/configuration/sources/file/ (default 1000).
vector_file_glob_cooldown_ms: 10

# --- Items 6-8: RECORD ONLY — no config change in this role (PLAN §4.6) ----
# These three items are either already implemented elsewhere (terraform) or
# apply at the OS/placement layer with no agent-role config surface. Recorded
# here (and cross-referenced from the other three tuned roles' defaults) so
# every §4.6 item has a documented disposition somewhere in ansible/roles/.
#
# Item 6 (NLBs): cross-zone load balancing ON + deregistration delay
# minimized are DONE IN TERRAFORM — cite
# terraform/modules/vector-aggregator/main.tf:110
# (enable_cross_zone_load_balancing = true) and :138 (deregistration_delay
# = 30, terraform comment already reads "PLAN §4.6(6)"); Cribl side:
# terraform/modules/cribl-stream/main.tf:180/207 (t1) and :241/264 (t2),
# identical values. The CONFIG-side part (client keep-alive vs NLB idle
# timeout) is addressed per-sink in vector.yaml.j2's to_agg_t1 comment — no
# separate item-6 config exists at the role/defaults level.
#
# Item 7 (Placement): same 2 AZs for generators/aggregator tiers/endpoints —
# DONE IN TERRAFORM via zone-id (not zone-NAME) selection, which is
# deliberately region-independent-of-alphabetical-AZ-letter-mapping; cite
# terraform/modules/sender-network/main.tf:20-31 and
# terraform/modules/logging-network/main.tf:14-28 (both compute `azs` from
# sorted `zone_ids`, then slice to `var.az_count`). CONSTRAINT ONLY — no
# ansible config change; single-AZ pinning is further-evaluation work
# (PLAN §5.4.5).
#
# Item 8 (OS/network): ENA is default-on for m6i instance types (AWS default,
# no terraform/ansible toggle needed — record only); no jumbo-frame change
# (VPC default MTU 9001 is used as-is, no ansible config touches MTU);
# unattended upgrades disabled during runs — ALREADY IN `common` role, cite
# ansible/roles/common/defaults/main.yml:25
# (common_disable_auto_updates: true) and its consumers
# ansible/roles/common/tasks/linux.yml (dnf-automatic.timer disable) +
# ansible/roles/common/tasks/windows.yml (wuauserv disable); generator
# output on gp3 default IOPS, NOT tmpfs — DONE IN TERRAFORM, cite
# terraform/modules/generator-hosts/main.tf:87 (volume_type = "gp3") —
# durability realism per PLAN §4.6.8, no ansible config change (the
# event-generator role writes to the OS filesystem path
# /opt/llt/generator/out (Linux) / C:\llt\generator\out (Windows), which
# resolves to this gp3-backed root volume, not a tmpfs/ramdisk mount).

# Item 3: buffer sizing so 10k EPS never blocks. 500 events (Vector's own
# buffer.max_events default) is far too small at 10k EPS (would fill in
# ~50 ms); sized generously against the largest tier (10k EPS/host * ~512 B
# padded events) so the memory buffer absorbs a multi-second stall without
# invoking when_full behavior in normal operation. Vendor doc (buffer block):
# https://vector.dev/docs/reference/configuration/sinks/http/ (buffer.*).
vector_buffer_max_events: 100000

# run_id used in the S3 key prefix for landing objects.
run_id: ""

# Absolute path to the NSSM binary that role `common` stages on Windows. Defined
# HERE (not only in common's defaults) because the Vector-agent play does NOT
# include the common role, so common_win_nssm_exe would be out of scope in this
# play — a role must not rely on another role's defaults being in the active
# play. Kept equal to common_win_nssm_exe (C:\llt\tools\nssm.exe). win_nssm's
# `executable:` needs this absolute path: the open SSM session's PATH does not
# yet include C:\llt\tools (installer PATH edits don't reach the running session).
common_win_nssm_exe: "C:\\llt\\tools\\nssm.exe"

# =============================================================================
# roles/event-generator/tasks/linux.yml
# =============================================================================
---
- name: Ensure generator directories exist (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ eventgen_dir_linux }}"
    - "{{ eventgen_dir_linux }}/out"

- name: Create a control-node tempfile for the eventgen.py fetch (M11)
  ansible.builtin.tempfile:
    state: file
    suffix: _llt_eventgen.py
  register: _eventgen_control_tmp
  delegate_to: localhost
  become: false       # no privilege escalation on the control node
  vars:
    # Override the play's `ansible_connection: aws_ssm` VAR — a task-level
    # `connection:` keyword loses to it, so localhost gets SSM'd into ("Invalid
    # instance id: localhost"). Setting the var wins and forces local.
    ansible_connection: local
  # M11 fix: the fetch below must land in CONTROL-NODE scratch, not at
  # eventgen_bin_linux (/opt/llt/generator/eventgen.py) — that path is the
  # HOST's install path. Writing it directly via delegate_to: localhost was
  # writing into (or failing to write into) that literal path ON THE CONTROL
  # NODE, which is wrong. Mirror the working Windows task pattern (tempfile ->
  # copy over SSM) instead.

- name: Fetch eventgen.py from the artifacts bucket to a control-node tempfile (Linux)
  amazon.aws.s3_object:
    bucket: "{{ eventgen_s3_uri | regex_replace('^s3://([^/]+)/.*$', '\\1') }}"
    object: "{{ eventgen_s3_uri | regex_replace('^s3://[^/]+/(.*)$', '\\1') }}"
    dest: "{{ _eventgen_control_tmp.path }}"
    mode: get
    region: "{{ llt_aws_region }}"
    profile: "{{ llt_logging_profile | default(omit) }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
  # Download on the control node from the logging-account artifacts bucket, then
  # push to the host over SSM (next task). We do this via control node because
  # the artifacts bucket is in the logging account (PLAN §4.3) and cross-account
  # host-side reads would need extra bucket policy; control-node profile is clean.

- name: Stage eventgen.py onto the host (Linux, over SSM)
  ansible.builtin.copy:
    src: "{{ _eventgen_control_tmp.path }}"    # fetched to control-node tempfile above
    dest: "{{ eventgen_bin_linux }}"
    mode: "0755"
  # `copy` (not delegate_to: localhost) — this task runs ON THE HOST over the
  # aws_ssm connection, which brokers the transfer via the artifacts bucket
  # (PLAN §4.2), reading from the control-node tempfile and landing at the
  # HOST's install path.

- name: Remove the control-node tempfile
  ansible.builtin.file:
    path: "{{ _eventgen_control_tmp.path }}"
    state: absent
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local

- name: Install eventgen systemd unit (Linux)
  ansible.builtin.template:
    src: eventgen.service.j2
    dest: /etc/systemd/system/{{ eventgen_service_name }}.service
    mode: "0644"
  notify: Reload systemd

- name: Ensure eventgen service is STOPPED and DISABLED (orchestrator-controlled)
  ansible.builtin.systemd:
    name: "{{ eventgen_service_name }}"
    enabled: false
    state: stopped
    daemon_reload: true
  # WHY stopped/disabled: the orchestrator starts the generator per-run via SSM
  # to control the warm-up/measurement window (PLAN §4.2). It must NOT autostart
  # on boot or on config push.

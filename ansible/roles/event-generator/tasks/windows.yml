# =============================================================================
# roles/event-generator/tasks/windows.yml
# =============================================================================
# Wrap eventgen.py as a Windows service via NSSM (community.windows.win_nssm),
# installed STOPPED/DISABLED so the orchestrator controls the run window
# (PLAN §4.2). NSSM is chosen over a raw scheduled task because it gives a real
# service with clean start/stop semantics over SSM, matching the Linux systemd
# model for parity of control.
---
- name: Ensure generator directories exist (Windows)
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ eventgen_dir_win }}"
    - "{{ eventgen_dir_win }}\\out"

- name: Fetch eventgen.py from the artifacts bucket to control node (Windows)
  amazon.aws.s3_object:
    bucket: "{{ eventgen_s3_uri | regex_replace('^s3://([^/]+)/.*$', '\\1') }}"
    object: "{{ eventgen_s3_uri | regex_replace('^s3://[^/]+/(.*)$', '\\1') }}"
    dest: "/tmp/llt_eventgen.py"
    mode: get
    region: "{{ llt_aws_region }}"
    profile: "{{ llt_logging_profile | default(omit) }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local   # override play's aws_ssm var (keyword loses to it)
    # The Windows play sets ansible_shell_type: powershell; on localhost (the
    # control node) that makes ansible try to run the module via PowerShell
    # ("/bin/sh: PowerShell: command not found"). Force sh for the delegated task.
    ansible_shell_type: sh

- name: Stage eventgen.py onto the Windows host (over SSM)
  ansible.windows.win_copy:
    src: "/tmp/llt_eventgen.py"
    dest: "{{ eventgen_bin_win }}"

- name: Locate python interpreter on Windows
  ansible.windows.win_shell: |
    # Role common installs Python (M10) with PrependPath=1, but that PATH edit
    # only affects processes started AFTER the installer ran — the already-open
    # SSM PowerShell session that converge uses still has the OLD $env:Path, so
    # a bare `Get-Command python` returns empty (verified live on i-0e394:
    # python.exe exists at C:\Program Files\Python312 and is on the MACHINE PATH,
    # but NOT on the session PATH). Refresh the session PATH from the machine
    # scope first, then resolve; fall back to globbing the known install roots so
    # the result is robust regardless of the pinned minor version / install dir.
    $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                [Environment]::GetEnvironmentVariable('Path','User')
    $cmd = Get-Command python.exe -ErrorAction SilentlyContinue |
             Select-Object -First 1 -ExpandProperty Source
    if (-not $cmd) {
      $cmd = Get-ChildItem -Path @(
                 'C:\Program Files\Python3*\python.exe',
                 'C:\Program Files (x86)\Python3*\python.exe',
                 'C:\Python3*\python.exe',
                 "$env:LOCALAPPDATA\Programs\Python\Python3*\python.exe"
               ) -ErrorAction SilentlyContinue |
               Select-Object -First 1 -ExpandProperty FullName
    }
    if (-not $cmd) { throw 'Could not locate python.exe on this Windows host' }
    $cmd
  register: _win_python
  changed_when: false
  # NSSM needs the ABSOLUTE interpreter path to launch eventgen.py; the last
  # line emitted above is that path.

- name: Install eventgen as an NSSM service (Windows)
  community.windows.win_nssm:
    name: "{{ eventgen_service_name }}"
    application: "{{ (_win_python.stdout_lines | select('match', '.*python\\.exe$') | list | last) | trim }}"
    arguments: '"{{ eventgen_bin_win }}" --config "{{ eventgen_config_win }}"'
    state: present
    start_mode: manual
  # start_mode: manual == not auto-start on boot; the orchestrator starts it
  # per-run via SSM (PLAN §4.2).

- name: Ensure eventgen service is STOPPED (orchestrator-controlled)
  ansible.windows.win_service:
    name: "{{ eventgen_service_name }}"
    state: stopped
    start_mode: manual

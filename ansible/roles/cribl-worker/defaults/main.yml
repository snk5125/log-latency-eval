# =============================================================================
# roles/cribl-worker/defaults/main.yml
# =============================================================================
# WHY: Cribl workers ARE the aggregator hops in the Cribl stack — the parity
# counterpart to vector-aggregator (HTTP Raw source :8080/:8081, S3 source via
# SQS in S3/S4, Eval adds hop_ts.agg1/agg2, S3 destination 5s/10MB, Webhook
# NDJSON t1->t2 1s — PLAN §4.4/§4.5 parity contract).
#
# C5 SCOPE NOTE: this role is INSTALL + JOIN + BOOT-START ONLY. It does NOT
# own or template the data-plane config that implements the parity contract
# above — workers are leader-managed in distributed mode, and anything
# written directly under a worker's own groups/<g>/local/cribl/ is liable to
# be overwritten the next time the leader commits+deploys that group. All of
# that templating (inputs/outputs/pipelines/route) lives in role cribl-leader
# instead, which owns $CRIBL_HOME/groups/<g>/local/cribl/ FROM THE LEADER and
# commits+deploys it via the leader's REST API. (Previously this role
# templated its own group config directly — that coupling is what C5 fixed.)
---
cribl_version: "4.13.0"
cribl_download_linux: "https://cdn.cribl.io/dl/{{ cribl_version }}/cribl-{{ cribl_version }}-linux-x64.tgz"
cribl_home: /opt/cribl
cribl_service_name: cribl

# Leader address workers join (PLAN §4.3). Supplied from Terraform output / the
# leader's private IP at deploy time (generated_infra.yml: cribl_leader_private_ip).
cribl_leader_host: "{{ cribl_leader_private_ip | default('llt-cs-leader.internal.invalid') }}"
# C6: 4200 is Cribl's DISTRIBUTED (leader<->worker) port; 9000 is the API/UI
# port and must NOT be used for the join. Kept as two distinct named defaults
# so a future config referencing "the leader port" for the UI/API doesn't
# silently reuse the wrong one.
cribl_dist_port: 4200
cribl_api_port: 9000
# Auth token used by `mode-worker -u` to authenticate the join (C6 — NOT the
# worker group; the group is passed via `-g`). Must match the leader's
# configured auth token. Generated/distributed the same way as the admin
# password (node-local, no_log, never committed — PLAN §7); the leader and
# every worker must agree on this value, so it is supplied as a deploy-time
# extra-var / group_vars secret, not generated independently per host.
cribl_auth_token: ""

# Worker group for THIS host: derived from the Role tag (agg-t1 -> t1, agg-t2 ->
# t2). Computed in tasks from llt_role; default here is a placeholder. Used
# only to select the `-g` value for the join (tasks/main.yml) — NOT for any
# local data-plane templating (see C5 scope note above).
cribl_worker_group: "t1"

# NOTE: ports/scenario/run_id/final-bucket/SQS-URL/batch-constant defaults
# that used to live here were REMOVED (C5 cleanup) — this role no longer
# templates any data-plane config that would consume them. Those defaults now
# live in role cribl-leader/defaults/main.yml, which is the role that
# actually renders groups/<g>/local/cribl/{inputs,outputs,pipelines/*}.

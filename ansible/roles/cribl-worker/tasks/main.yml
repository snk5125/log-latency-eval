# =============================================================================
# roles/cribl-worker/tasks/main.yml — install worker, join leader, boot-start
# =============================================================================
# Workers are Linux-only (PLAN §4.3 m6i.xlarge). Group derives from the Role tag.
#
# C5: this role is now INSTALL + JOIN + BOOT-START ONLY. All data-plane config
# (inputs/outputs/pipelines/route for groups t1/t2) is owned by the LEADER
# (role cribl-leader, templated under groups/<g>/local/cribl/ + committed and
# deployed to the group) — a leader-managed worker's own local groups/ tree is
# overwritten on the next commit+deploy, so templating it here would be
# clobbered and is actively misleading about where the config really lives.
---
- name: Derive worker group from Role tag (agg_t1->t1, agg_t2->t2)
  ansible.builtin.set_fact:
    cribl_worker_group: "{{ 't1' if llt_role == 'agg_t1' else 't2' }}"
  # PLAN §4.3 worker groups mirror the Vector two-tier topology for parity.

- name: Download pinned Cribl package (worker)
  ansible.builtin.get_url:
    url: "{{ cribl_download_linux }}"
    dest: "/tmp/cribl-{{ cribl_version }}.tgz"
    mode: "0644"

- name: Unpack Cribl (worker)
  ansible.builtin.unarchive:
    src: "/tmp/cribl-{{ cribl_version }}.tgz"
    dest: /opt
    remote_src: true

- name: Record exact deployed Cribl version as evidence (worker)
  ansible.builtin.command: "{{ cribl_home }}/bin/cribl version"
  register: _cribl_worker_version
  changed_when: false
  failed_when: false

- name: Configure worker to join the leader (distributed worker mode)
  ansible.builtin.command: >-
    {{ cribl_home }}/bin/cribl mode-worker
    -H {{ cribl_leader_host }} -p {{ cribl_dist_port }}
    -u {{ cribl_auth_token }} -g {{ cribl_worker_group }}
  register: _cribl_mode_worker
  changed_when: "'already' not in (_cribl_mode_worker.stdout | default(''))"
  # C6 fixes:
  #   - port 4200 (cribl_dist_port), NOT 9000 — 9000 is the API/UI port, not
  #     the leader<->worker distributed port the join uses.
  #   - -u is the AUTH TOKEN (cribl_auth_token), NOT the worker group.
  #   - -g is the worker GROUP (cribl_worker_group) — previously absent, with
  #     the group value wrongly stuffed into -u instead.
  # `failed_when: false` REMOVED — a failed join must abort the play (the
  # worker cannot receive its group's config at all), not proceed silently
  # into boot-start with a node that isn't actually attached to the leader.

- name: Enable Cribl worker boot-start service
  ansible.builtin.command: >-
    {{ cribl_home }}/bin/cribl boot-start enable -u root
  register: _cribl_worker_bootstart
  changed_when: "'already' not in (_cribl_worker_bootstart.stdout | default(''))"
  # M4: boot-start now runs BEFORE any handler flush (there is no
  # configure.yml include left in this role to flush against — see C5 — but
  # keep this ordering note as the load-bearing invariant: boot-start MUST
  # precede any task that restarts/depends on the `cribl` systemd unit,
  # because that unit does not exist until boot-start creates it).
  # `failed_when: false` REMOVED per the "drop failed_when masks on cribl
  # mode/boot-start" cleanup (m6) — a failed boot-start leaves the worker
  # unable to run as a service at all, which must fail the play.

- name: Ensure worker service is started
  ansible.builtin.systemd:
    name: "{{ cribl_service_name }}"
    state: started
    enabled: true

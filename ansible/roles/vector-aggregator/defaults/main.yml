# =============================================================================
# roles/vector-aggregator/defaults/main.yml
# =============================================================================
# WHY: Vector aggregator nodes form the tier-1/tier-2 hops (PLAN §4.3). Each tier
# stamps its own hop_ts (agg1 on tier-1, agg2 on tier-2), and the sink depends on
# scenario (PLAN §2): terminal tiers write final S3; middle tiers forward HTTP to
# the next tier. This role is the parity counterpart to cribl-worker.
#
# TIER SELECTION: a host's tier comes from its Role tag (agg-t1 / agg-t2), exposed
# as llt_role (role_agg_t1 / role_agg_t2 groups). The template branches on it.
---
# Reuse the SAME pinned Vector version as the agent role so agent and aggregator
# run identical Vector builds (clean parity; version recorded to evidence, §7).
vector_version: "0.49.0"
vector_download_base: "https://packages.timber.io/vector/{{ vector_version }}"
vector_linux_arch: "x86_64-unknown-linux-gnu"

vector_dir_linux: /opt/vector
vector_config_linux: /etc/vector/vector.yaml
vector_service_name: vector

# --- Ports (PLAN §4.4) ------------------------------------------------------
vector_t1_http_port: 8080          # Tier-1 HTTP source listens :8080
vector_t2_http_port: 8081          # Tier-2 HTTP source listens :8081

# --- Scenario + run wiring (injected per run) -------------------------------
scenario: "s1"
run_id: ""
vector_aws_region: "{{ llt_aws_region | default('us-east-2') }}"

# Tier-2 NLB DNS — where tier-1 forwards in S2/S4 (PLAN §4.3 llt-vagg-t2-nlb).
vector_agg_t2_nlb: "llt-vagg-t2-nlb.internal.invalid"

# Final destination bucket (logging account, PLAN §4.3 llt-final-<acct>).
vector_final_bucket: "llt-final-REPLACE"

# S3 source (S3/S4 only): SQS queue fed by landing-bucket event notifications
# (PLAN §4.3). Event-driven pickup, not poll-interval. Enabled only in S3/S4.
vector_landing_sqs_url: "https://sqs.us-east-2.amazonaws.com/REPLACE/llt-landing-vagg-q"

# --- Batch constants — CONTROLLED CONSTANT (PLAN §4.5) ----------------------
vector_s3_batch_timeout_secs: 5           # ->S3 hops: 5 s
vector_s3_batch_max_bytes: 10485760       # 10 MB
vector_http_batch_timeout_secs: 1         # inter-aggregator HTTP: 1 s (PLAN §4.5)

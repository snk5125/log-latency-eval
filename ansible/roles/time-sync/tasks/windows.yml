# =============================================================================
# roles/time-sync/tasks/windows.yml — w32time -> AWS Time Sync
# =============================================================================
# PLAN §5.3: "Windows: w32time -> AWS Time Sync, 64 s poll floor." Windows sync
# is coarser than chrony; the assertion bound is 5 ms (vs 1 ms Linux) and the
# report carries wider error bars for Windows deltas (PLAN §5.4 caveat 4).
---
- name: Configure w32time manual peer list to AWS Time Sync (NTP)
  ansible.windows.win_shell: >-
    w32tm /config /manualpeerlist:"{{ time_sync_source }},0x8"
    /syncfromflags:manual /reliable:yes /update
  register: _w32tm_config
  changed_when: true
  # 0x8 = client mode (SpecialInterval NOT set on the flag here; the poll floor
  # is enforced via the registry SpecialPollInterval below). syncfromflags:manual
  # forces w32time to use ONLY our peer, mirroring the Linux single-source rule.

- name: Set NtpClient SpecialPollInterval to 64 s poll floor (PLAN §5.3)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient
    name: SpecialPollInterval
    data: "{{ time_sync_win_special_poll_interval }}"
    type: dword
  # SpecialPollInterval (seconds) is the minimum poll cadence; 64 s keeps
  # Windows querying AWS Time Sync frequently enough to hold the 5 ms bound.

- name: Enable the SpecialInterval flag on the manual peer
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient
    name: NtpServer
    data: "{{ time_sync_source }},0x1"
    type: string
  # 0x1 = SpecialInterval: use SpecialPollInterval instead of the default
  # exponential backoff, so the 64 s cadence actually takes effect.

- name: Ensure Windows Time service is running and set to automatic
  ansible.windows.win_service:
    name: w32time
    start_mode: auto
    state: started

- name: Restart Windows Time service to apply configuration
  ansible.windows.win_service:
    name: w32time
    state: restarted

- name: Force an immediate resync so sync is tight before any run
  ansible.windows.win_shell: w32tm /resync /rediscover
  changed_when: false
  failed_when: false
  # Best-effort immediate resync; the assert-clocks.yml stripchart is the
  # authoritative pre-run gate (PLAN §5.3).

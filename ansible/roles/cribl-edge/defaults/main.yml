# =============================================================================
# roles/cribl-edge/defaults/main.yml
# =============================================================================
# WHY: Cribl Edge is the OTHER forwarding agent (PLAN §3), the parity counterpart
# to the vector-agent role. It monitors the SAME generator output file, adds the
# SAME hop_ts.agent field via an Eval function, and forwards over the SAME
# NDJSON-over-HTTP transport / SAME S3 batch constants (PLAN §4.4, §4.5). The
# whole point of the experiment is that hop COUNT — not agent vendor — is the
# variable, so these must match role vector-agent field-for-field.
#
# STANDALONE MODE (not fleet-managed): Cribl Edge can run either fleet-managed
# (reporting to a Cribl leader) or standalone. We choose STANDALONE and deliver
# config as files under $CRIBL_HOME/local/. WHY: fleet management would add a
# leader dependency and a control-plane config-distribution path that is
# irrelevant to hop latency and would couple the agent to the Cribl Stream
# leader's availability. Standalone keeps the agent self-contained and its
# config reproducible from the repo (PLAN §7 config-as-files).
---
# --- PINNED Cribl version --------------------------------------------------
# Pinned; exact deployed version recorded to evidence (PLAN §7). Cribl publishes
# a moving "latest" URL and versioned downloads; we pin the version string.
cribl_edge_version: "4.18.2"

# Cribl provides a combined package; Edge is launched in edge mode. The CDN URL
# embeds a per-release build hash not derivable from the version, so the full
# Linux URL is hardcoded (verified 200). Prior 4.13.0/no-hash URL 404'd.
cribl_edge_download_linux: "https://cdn.cribl.io/dl/4.18.2/cribl-4.18.2-fd1f0d2f-linux-x64.tgz"
# M3: Cribl does NOT ship a Windows .zip for Edge — Windows install is via MSI.
# URL follows Cribl's documented download-CDN pattern for the Windows MSI
# artifact. TODO: confirm the exact 4.13.0 MSI filename/URL against
# https://docs.cribl.io/edge/deploy-windows/ (or the CDN listing) before first
# real deploy — left as a comment rather than blocking the build (per the
# task's "do not stall" guidance for unverified URLs).
cribl_edge_download_win: "https://cdn.cribl.io/dl/{{ cribl_edge_version }}/cribl-{{ cribl_edge_version }}-windows-x64.msi"

# CRIBL_HOME install roots.
cribl_home_linux: /opt/cribl
cribl_home_win: C:\Cribl
cribl_edge_service_name: cribl

# Config lives under $CRIBL_HOME/local/cribl/ (standalone file-based config).
cribl_edge_local_linux: /opt/cribl/local/cribl
cribl_edge_local_win: C:\Cribl\local\cribl

# --- Source: generator output file to monitor (parity with vector-agent) ----
cribl_edge_source_path_linux: /opt/llt/generator/out/events.ndjson
# Backslash form — reserved for any win_* MODULE that needs a literal Windows
# path (fetch/copy/service management). NOT for rendered config content.
cribl_edge_source_path_win: C:\llt\generator\out\events.ndjson
# Forward-slash form of the same path, for use ONLY inside rendered config
# content (inputs.yml.j2 `filenames:`). Backslashes inside a double-quoted
# YAML/JSON scalar produce illegal escapes and Cribl's config loader rejects
# the file (C11 fix).
cribl_edge_source_path_win_fwd: "C:/llt/generator/out/events.ndjson"

# --- Scenario wiring (injected per run) ------------------------------------
scenario: "s1"

# --- Cross-pairing (C10) ----------------------------------------------------
# CRITICAL: the agent targets the CELL's aggregator, not its own stack's. A
# Cribl Edge agent running in a Vector-aggregator cell (aggregator=vagg) must
# still send to the Vector tier-1 NLB / Vector landing bucket, and vice versa.
# The `aggregator` extra-var (vagg|cs) is passed by the orchestrator per run
# (harness/orchestrator/run_matrix.py); default to 'vagg' so site.yml (which
# runs without that extra-var) still renders.
aggregator: "vagg"

# Tier-1 aggregator NLB DNS names — HTTP target for S1/S2. Both stacks' NLB
# names are populated from generated_infra.yml at deploy time (Terraform
# outputs); llt_t1_endpoint below selects the correct one for this cell.
# (Previously this file claimed "the orchestrator passes the correct NLB DNS"
# via cribl_edge_agg_t1_nlb directly — that was never true: the orchestrator
# only passes run_id/scenario/agent/aggregator/volume/eventgen_* extra-vars,
# per its documented contract. Endpoint selection happens HERE via
# llt_t1_endpoint, keyed on the `aggregator` var, matching vector-agent.)
vector_agg_t1_nlb: "llt-vagg-t1-nlb.internal.invalid"
cribl_edge_agg_t1_nlb: "llt-cs-t1-nlb.internal.invalid"
cribl_edge_agg_t1_port: 8080             # Tier-1 :8080 (PLAN §4.4), both stacks
# Selected T1 HTTP endpoint for THIS cell (C10) — use in outputs.yml.j2,
# not cribl_edge_agg_t1_nlb directly.
llt_t1_endpoint: "{{ vector_agg_t1_nlb if (aggregator | default('vagg')) == 'vagg' else cribl_edge_agg_t1_nlb }}"

# Landing buckets for S3/S4 — both stacks' bucket names populated from
# generated_infra.yml; llt_landing_bucket below selects the correct one.
vector_landing_bucket: "llt-landing-vagg-REPLACE"
cribl_edge_landing_bucket: "llt-landing-cs-REPLACE"
# Selected landing bucket for THIS cell (C10) — use in outputs.yml.j2,
# not cribl_edge_landing_bucket directly.
llt_landing_bucket: "{{ vector_landing_bucket if (aggregator | default('vagg')) == 'vagg' else cribl_edge_landing_bucket }}"

cribl_edge_aws_region: "{{ llt_aws_region | default('us-east-2') }}"

# --- Batch constants — CONTROLLED CONSTANT (PLAN §4.5), identical to Vector --
cribl_edge_s3_flush_secs: 5              # S3 flush 5 s (== Vector timeout_secs)
cribl_edge_s3_max_bytes: 10485760       # 10 MB (== Vector max_bytes)

# --- Low-latency tuning profile (PLAN §4.6) — see docs/TUNING.md -----------
# Item 1: File Monitor source discovery/poll interval. Cribl's "Polling
# interval" defaults to 10 s (docs.cribl.io/stream/sources-file-monitor/,
# same source type used standalone by Edge) — floored to 1 s, the parity
# counterpart to Vector's glob_minimum_cooldown_ms floor (vector-agent
# defaults/main.yml). Could not find a documented MINIMUM for this setting
# (only the 10 s default) — 1 s is chosen as a safe practical floor rather
# than 0, which risks being rejected/rounded by the UI's own validation;
# left as a TODO to verify against a live 4.13 instance if 0 is in fact
# accepted as "as fast as possible."
cribl_edge_poll_interval_secs: 1

# Items 6-8: RECORD ONLY — see the full citations in
# ansible/roles/vector-agent/defaults/main.yml ("Items 6-8" block). Summary:
# item 6 (NLB cross-zone + deregistration delay) done in terraform (both
# vector-aggregator and cribl-stream modules, identical values — parity);
# item 7 (2-AZ placement) done in terraform via zone-id selection,
# constraint-only; item 8 (ENA/MTU/unattended-upgrades/gp3-not-tmpfs) is
# either an AWS default, already in the `common` role, or terraform-side —
# no cribl-edge config change for any of the three.

# Item 2: Webhook destination request concurrency. Cribl default is 5
# (range 1-32, docs.cribl.io/stream/destinations-webhook/); raised toward
# the documented max so concurrency is allowed to scale under load (parity
# intent with Vector's adaptive concurrency, though Cribl's own knob is a
# fixed cap rather than an adaptive algorithm — recorded as a parity-ledger
# asymmetry in docs/TUNING.md: Cribl's "scale" is a raised static ceiling,
# Vector's is a live-adaptive algorithm).
cribl_edge_concurrency: 32

run_id: ""

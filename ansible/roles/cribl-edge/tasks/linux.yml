# =============================================================================
# roles/cribl-edge/tasks/linux.yml — install pinned Cribl Edge (tgz), standalone
# =============================================================================
---
- name: Download pinned Cribl package (Linux)
  ansible.builtin.get_url:
    url: "{{ cribl_edge_download_linux }}"
    dest: "/tmp/cribl-{{ cribl_edge_version }}.tgz"
    mode: "0644"

- name: Ensure /opt exists and unpack Cribl (Linux)
  ansible.builtin.unarchive:
    src: "/tmp/cribl-{{ cribl_edge_version }}.tgz"
    dest: /opt
    remote_src: true
    # tgz unpacks to /opt/cribl (== cribl_home_linux).

- name: Ensure standalone local config directory exists (Linux)
  ansible.builtin.file:
    path: "{{ cribl_edge_local_linux }}"
    state: directory
    mode: "0755"
  # $CRIBL_HOME/local/cribl — where standalone (non-fleet) config files live.

- name: Record exact deployed Cribl version as evidence (Linux)
  ansible.builtin.command: "{{ cribl_home_linux }}/bin/cribl version"
  register: _cribl_edge_version_out
  changed_when: false
  failed_when: false
  # PLAN §7: record exact deployed version to evidence.

- name: Select Cribl Edge product mode (Linux)
  ansible.builtin.command: "{{ cribl_home_linux }}/bin/cribl mode-edge"
  register: _cribl_edge_mode
  changed_when: "'already' not in (_cribl_edge_mode.stdout | default(''))"
  # C7 fix: `cribl boot-start enable -m edge` is INVALID — boot-start's -m flag
  # takes an INIT SYSTEM (systemd|initd), not a product mode. Product mode
  # (edge vs stream) is selected by `cribl mode-edge` beforehand; standalone
  # (no leader URL), so Edge runs self-managed from local/.

- name: Install Cribl Edge as a systemd boot service (Linux)
  ansible.builtin.command: >-
    {{ cribl_home_linux }}/bin/cribl boot-start enable -m systemd -u root
  register: _cribl_edge_bootstart
  changed_when: "'already' not in (_cribl_edge_bootstart.stdout | default(''))"
  # C7 fix: -m systemd is the init-system selector boot-start actually expects;
  # -u root runs the service as root (needed to read the generator output file
  # regardless of which user wrote it).

- name: Ensure Cribl Edge service is started (Linux)
  ansible.builtin.systemd:
    name: "{{ cribl_edge_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  # Parity with the (working) cribl-stream role, which has the equivalent
  # "Ensure Cribl service is started" step. `boot-start enable` writes the unit
  # file to /etc/systemd/system but does NOT `systemctl daemon-reload`, so the
  # subsequent config-template handler ("Restart cribl edge (linux)") could not
  # find the unit ("Could not find the requested service cribl-edge"). Starting
  # it here with daemon_reload:true registers the freshly-written unit BEFORE the
  # config handler fires, so the restart notify has a real service to act on.

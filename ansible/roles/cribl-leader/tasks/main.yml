# =============================================================================
# roles/cribl-leader/tasks/main.yml — install pinned Cribl Stream leader
# =============================================================================
---
- name: Download pinned Cribl package (leader)
  ansible.builtin.get_url:
    url: "{{ cribl_download_linux }}"
    dest: "/tmp/cribl-{{ cribl_version }}.tgz"
    mode: "0644"

- name: Unpack Cribl (leader)
  ansible.builtin.unarchive:
    src: "/tmp/cribl-{{ cribl_version }}.tgz"
    dest: /opt
    remote_src: true

- name: Ensure leader local config dir exists
  ansible.builtin.file:
    path: "{{ cribl_home }}/local/cribl"
    state: directory
    mode: "0755"

- name: Record exact deployed Cribl version as evidence (leader)
  ansible.builtin.command: "{{ cribl_home }}/bin/cribl version"
  register: _cribl_leader_version
  changed_when: false
  failed_when: false

- name: Configure Cribl in distributed LEADER mode
  ansible.builtin.command: >-
    {{ cribl_home }}/bin/cribl mode-master
  register: _cribl_mode_master
  changed_when: "'already' not in (_cribl_mode_master.stdout | default(''))"
  # mode-master puts this node in distributed leader mode (PLAN §4.3). Workers
  # join it (cribl-worker role). Legacy verb name retained by Cribl CLI.
  # `failed_when: false` REMOVED (m6) — a failed mode switch must abort the
  # play; proceeding would install a leader that silently isn't actually in
  # distributed mode.

- name: Template worker-group definitions onto the leader
  ansible.builtin.template:
    src: groups.yml.j2
    dest: "{{ cribl_home }}/local/cribl/groups.yml"
    mode: "0644"
  notify: Restart cribl leader
  # Defines worker groups t1 and t2 (PLAN §4.3). Per-group DATA-PLANE config
  # (inputs/outputs/pipelines/route) is templated + committed + deployed by
  # THIS role too (see the configure.yml loop at the end of this file) — C5:
  # workers are leader-managed, so cribl-worker no longer owns that config
  # (previously it did, mirroring vector-aggregator; that coupling broke
  # because a worker's own local groups/ writes are overwritten by the
  # leader's next commit+deploy).

# --- Admin bootstrap: generate password on-node, store ONLY on node ---------
# M12: `cribl auth reset-password` does NOT exist as a CLI subcommand in 4.13.
# The admin password for a fresh instance is set by writing
# $CRIBL_HOME/local/cribl/auth/users.json with a bcrypt hash of the password
# BEFORE the service's first start (Cribl reads this file at boot to seed the
# local user store; after first start it manages users via its own DB and
# ignores subsequent edits to this file — hence "before first start" matters).
# C8: also fixes the cribl_pw_stat / cribl_generated_admin_pw typos throughout
# this block (previously registered as cribl_pw_stat but referenced as
# criblcribl_pw_stat, and vice versa for the admin-pw fact) — the mismatched
# names meant the `when:` guards always evaluated against an undefined
# variable and the whole bootstrap block was dead code.
- name: Check whether admin password file already exists
  ansible.builtin.stat:
    path: "{{ cribl_admin_password_file }}"
  register: cribl_pw_stat

- name: Check whether Cribl has already been started once (users.json present)
  ansible.builtin.stat:
    path: "{{ cribl_home }}/local/cribl/auth/users.json"
  register: cribl_users_json_stat
  # Only safe to WRITE users.json before Cribl's first start (see note above);
  # this guards the write, independent of our own password-file bookkeeping.

- name: Generate a random admin password on the node (no secrets in repo)
  ansible.builtin.set_fact:
    cribl_generated_admin_pw: >-
      {{ cribl_admin_password if (cribl_admin_password | length > 0)
         else lookup('ansible.builtin.password',
                     '/dev/null length=24 chars=ascii_letters,digits') }}
  when: not cribl_pw_stat.stat.exists
  no_log: true
  # WHY no_log + /dev/null lookup: PLAN §7 — no secrets in the repo. The password
  # is generated at run time, never written to git, and persisted ONLY on the
  # node (next task). Retrieval is via SSM (documented, not committed).

- name: Persist generated admin password ONLY on the node (0600)
  ansible.builtin.copy:
    content: "{{ cribl_generated_admin_pw }}\n"
    dest: "{{ cribl_admin_password_file }}"
    mode: "0600"
    owner: root
    group: root
  when: not cribl_pw_stat.stat.exists
  no_log: true
  # Node-only. Operators retrieve via: aws ssm start-session ... then cat this
  # file. It is gitignored territory and never leaves the host through Ansible.

- name: Ensure the auth directory exists for users.json (M12)
  ansible.builtin.file:
    path: "{{ cribl_home }}/local/cribl/auth"
    state: directory
    mode: "0700"
    owner: root
    group: root
  when: not cribl_users_json_stat.stat.exists

- name: Bcrypt-hash the generated admin password (control-node computation)
  ansible.builtin.set_fact:
    _cribl_admin_pw_bcrypt: "{{ cribl_generated_admin_pw | password_hash('bcrypt') }}"
  when:
    - not cribl_pw_stat.stat.exists
    - not cribl_users_json_stat.stat.exists
  no_log: true
  # password_hash('bcrypt') is an ansible.builtin Jinja2 filter backed by
  # passlib on the CONTROL node — no extra collection required. Verify the
  # control node has passlib installed (pip install passlib) since this
  # filter raises at template time otherwise.

- name: Write users.json to seed the admin account before first start (M12)
  ansible.builtin.copy:
    content: |
      {
        "admin": {
          "username": "admin",
          "password": "{{ _cribl_admin_pw_bcrypt }}",
          "role": "admin"
        }
      }
    dest: "{{ cribl_home }}/local/cribl/auth/users.json"
    mode: "0600"
    owner: root
    group: root
  when:
    - not cribl_pw_stat.stat.exists
    - not cribl_users_json_stat.stat.exists
  no_log: true
  # TODO(verify): this is the standard Cribl users.json shape (username/
  # bcrypt-password/role keyed by username) used by the pre-seed-admin-user
  # pattern; if Cribl 4.13 rejects this exact shape on first boot, check
  # $CRIBL_HOME/log/cribl.log after the "Ensure leader service is started"
  # task below and adjust the schema — left as a fast-follow rather than
  # blocking the whole build per the task's "do not stall" guidance.

# --- Auth token bootstrap: workers authenticate their join with this token --
# Generated the SAME WAY as the admin password (node-local, no_log, never
# committed — PLAN §7). role cribl-worker's `mode-worker -u` (C6) needs this
# exact value; deploy tooling reads it back off the leader via SSM and passes
# it to workers as an extra-var/group_vars secret (mirrors admin-pw retrieval).
- name: Check whether the auth-token file already exists
  ansible.builtin.stat:
    path: "{{ cribl_auth_token_file }}"
  register: cribl_token_stat

- name: Generate a random auth token on the node (no secrets in repo)
  ansible.builtin.set_fact:
    cribl_generated_auth_token: >-
      {{ cribl_auth_token if (cribl_auth_token | length > 0)
         else lookup('ansible.builtin.password',
                     '/dev/null length=32 chars=ascii_letters,digits') }}
  when: not cribl_token_stat.stat.exists
  no_log: true

- name: Persist generated auth token ONLY on the node (0600)
  ansible.builtin.copy:
    content: "{{ cribl_generated_auth_token }}\n"
    dest: "{{ cribl_auth_token_file }}"
    mode: "0600"
    owner: root
    group: root
  when: not cribl_token_stat.stat.exists
  no_log: true
  # Node-only, same retrieval story as the admin password file above.

- name: Enable Cribl leader boot-start service
  ansible.builtin.command: >-
    {{ cribl_home }}/bin/cribl boot-start enable -u root
  register: _cribl_leader_bootstart
  changed_when: "'already' not in (_cribl_leader_bootstart.stdout | default(''))"
  # `failed_when: false` REMOVED (m6) — see mode-master note above; a failed
  # boot-start leaves the leader unable to run as a service at all.

- name: Ensure leader service is started
  ansible.builtin.systemd:
    name: "{{ cribl_service_name }}"
    state: started
    enabled: true

# --- C5: template + commit + deploy BOTH worker groups' data-plane config ---
# Runs at install time too so a fresh deploy already has valid (if default
# scenario s1) group config before the first orchestrator run.
- name: Configure + commit + deploy each worker group's data-plane config
  ansible.builtin.include_tasks: configure.yml
  loop: "{{ cribl_worker_groups }}"
  loop_control:
    loop_var: _group

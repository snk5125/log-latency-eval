# =============================================================================
# roles/cribl-leader/defaults/main.yml
# =============================================================================
# WHY: Cribl Stream runs distributed (PLAN §4.3) — one Leader coordinates two
# worker groups (t1, t2). The leader holds the config bundle that workers pull.
# LICENSE: Cribl Free (PLAN §4.3, §4.5 note) — ≤1 TB/day, all tiers well below.
# The leader is Linux-only (single m6i.large, PLAN §4.3).
---
# Pinned Cribl version — SAME as cribl-edge for a single Cribl build across the
# stack (parity + evidence, PLAN §7).
cribl_version: "4.13.0"
cribl_download_linux: "https://cdn.cribl.io/dl/{{ cribl_version }}/cribl-{{ cribl_version }}-linux-x64.tgz"

cribl_home: /opt/cribl
cribl_service_name: cribl

# Distributed-mode worker groups (PLAN §4.3). t1 = tier-1 workers, t2 = tier-2.
cribl_worker_groups:
  - t1
  - t2

# Admin bootstrap. WHY generated-on-node: PLAN §7 forbids secrets in the repo.
# The password is generated on the leader, stored ONLY on the node, and noted
# for retrieval via SSM (never committed). Empty here means "generate".
cribl_admin_password: ""      # generated on node if empty; see tasks/main.yml
cribl_admin_password_file: /opt/cribl/local/cribl/.llt_admin_pw   # node-only

# --- Ports (PLAN §4.4 for data-plane; Cribl-specific for control-plane) -----
cribl_api_port: 9000          # Leader REST API / UI (C5 commit+deploy calls).
cribl_dist_port: 4200         # Leader<->worker distributed port (workers join here).
cribl_t1_http_port: 8080      # t1 group HTTP Raw source (identical to vector-aggregator).
cribl_t2_http_port: 8081      # t2 group HTTP Raw source.

# Auth token workers present when joining (`mode-worker -u`, role cribl-worker
# C6). Generated the same way as the admin password if left empty: node-local,
# no_log, never committed (PLAN §7) — see tasks/main.yml bootstrap block.
# Leader and every worker must agree on this value; deploy tooling is expected
# to read it back off the leader node (SSM) and pass it to workers via
# extra-vars/group_vars, mirroring the admin-password retrieval pattern.
cribl_auth_token: ""
cribl_auth_token_file: /opt/cribl/local/cribl/.llt_auth_token   # node-only

# --- C5: group data-plane config vars (moved here from cribl-worker; the
# LEADER now owns templating groups/<g>/local/cribl/*, not the worker) -------
cribl_aws_region: "{{ llt_aws_region | default('us-east-2') }}"
# Tier-2 NLB DNS — where tier-1 workers forward in S2/S4.
cribl_agg_t2_nlb: "llt-cs-t2-nlb.internal.invalid"
# Final bucket + landing SQS (mirrors vector-aggregator).
cribl_final_bucket: "llt-final-REPLACE"
cribl_landing_sqs_url: "https://sqs.us-east-2.amazonaws.com/REPLACE/llt-landing-cs-q"
# Batch constants — CONTROLLED CONSTANT (PLAN §4.5), identical to Vector.
cribl_s3_flush_secs: 5              # ->S3: 5 s  (== Vector timeout_secs)
cribl_s3_max_bytes_mb: 10          # 10 MB     (== Vector max_bytes)
cribl_http_flush_secs: 1           # inter-tier HTTP: 1 s (== Vector http batch)
# Scenario + run wiring (injected per run by configure-scenario.yml).
scenario: "s1"
run_id: ""

# --- Low-latency tuning profile (PLAN §4.6) — see docs/TUNING.md -----------
# Items 6-8: RECORD ONLY — see the full citations in
# ansible/roles/vector-agent/defaults/main.yml ("Items 6-8" block). Item 6's
# NLB cross-zone/deregistration-delay terraform citations for THIS stack:
# terraform/modules/cribl-stream/main.tf:180 (t1
# enable_cross_zone_load_balancing) / :207 (t1 deregistration_delay) and
# :241 (t2 enable_cross_zone_load_balancing) / :264 (t2 deregistration_delay)
# — identical values to the vector-aggregator module (parity). No
# cribl-leader/cribl-worker role config change for items 6-8.
#
# Item 2: t1->t2 Webhook destination request concurrency + compression.
# Same values/rationale as cribl-edge's cribl_edge_concurrency (parity
# counterpart to Vector's adaptive concurrency on the T1->T2 hop). Cribl
# Webhook default concurrency is 5 (range 1-32); compression defaults ON
# (must be explicitly disabled for parity with Vector's compression-off
# default). Vendor doc: docs.cribl.io/stream/destinations-webhook/.
cribl_t2_webhook_concurrency: 32

# Item 4: S3 source SQS long-poll wait. Cribl's S3 source "Poll timeout
# (secs)" — min 1 / default 10 / MAX 20 (docs.cribl.io/stream/sources-s3/).
# Floored... i.e. RAISED to the ceiling (20 is the "as long as possible"
# setting, matching AWS SQS's own WaitTimeSeconds hard max) per PLAN
# §4.6.4's literal `WaitTimeSeconds=20`.
cribl_s3_poll_timeout_secs: 20

# Item 5: worker process count. m6i.xlarge = 4 vCPU (PLAN §4.3). Cribl's
# Group Settings > Worker Processes field takes a POSITIVE integer as an
# EXACT process count (docs.cribl.io/stream/scaling/: "Positive numbers
# specify an absolute number of Workers") — set to 4 (== vCPU count) so
# every core runs a worker process, maximizing parallelism, matching PLAN
# §4.6.5's "Cribl worker processes set to vCPU count." (Cribl's own
# documented DEFAULT for this setting is -2, i.e. vCPU count minus 2 — on a
# 4-vCPU node that is only 2 worker processes; -2 note: the node-level
# cribl.yml `workers.count` key documents its OWN default as 1 with "if
# less than 1, the value is added to CPU count" semantics — the two default
# figures (-2 via Group Settings prose vs 1 via cribl.yml schema comment)
# are NOT reconciled in Cribl's own docs across the pages checked; recorded
# as a discrepancy in docs/TUNING.md rather than silently picking one.)
cribl_worker_processes: 4

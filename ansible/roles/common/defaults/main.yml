# =============================================================================
# roles/common/defaults/main.yml
# =============================================================================
# Base host preparation shared by every llt host. WHY: a clean, quiet, uniform
# baseline is a prerequisite for latency measurement — background package
# activity or auto-reboots would inject uncontrolled noise into per-hop timings
# (PLAN §1 research question isolates hop count/volume as the variables).
---
# Linux base packages needed by later roles and by the SSM file-transfer path.
# - python3 : ansible module execution target (PLAN §4.2 aws_ssm).
# - tar/unzip : fetch + unpack Vector/Cribl/harness artifacts from S3.
# - chrony : installed/managed by the time-sync role, listed here so the base
#   image always has the package available before time-sync runs.
# NOTE: `curl` is intentionally NOT listed — AL2023 pre-installs `curl-minimal`
# (which provides /usr/bin/curl); installing full `curl` triggers a dnf depsolve
# conflict with curl-minimal. curl-minimal is sufficient for our use.
common_linux_packages:
  - python3
  - tar
  - unzip
  - chrony

# WHY disable unattended upgrades during runs: an apt/dnf automatic update or a
# security-triggered service restart mid-run would perturb CPU/IO and clock
# behavior, contaminating latency samples (noise control, PLAN §1). We disable
# for the duration of the experiment; teardown is out of scope for this role.
common_disable_auto_updates: true

# --- M10: Windows Python + NSSM install ------------------------------------
# The stock Windows Server 2022 AMI ships with NEITHER — both are fetched over
# the internet during converge, which is why PLAN §4.2 permits a temporary NAT
# gateway for package installation (disable it again once site.yml completes).
# Python: pinned version, official python.org installer (bootstrapper .exe,
# not a bare MSI — see win_package task for the /quiet argument shape).
common_win_python_version: "3.12.4"
common_win_python_installer_url: "https://www.python.org/ftp/python/{{ common_win_python_version }}/python-{{ common_win_python_version }}-amd64.exe"
# MSI ProductId embedded by the python.org bootstrapper for this release/arch;
# used by win_package to detect "already installed" without re-running the
# installer. TODO(verify): confirm this GUID against the actual installed
# product if win_package's idempotency check ever misfires — the win_stat
# guard on common_win_python_exe is the primary idempotency gate regardless.
common_win_python_product_id: "{65DEB1AA-D0CC-4109-9E48-DFAB6E3B4CE1}"
common_win_python_exe: "C:\\Program Files\\Python312\\python.exe"

# NSSM: pinned version, official nssm.cc download. Extracted (not MSI/exe
# installed) — nssm.exe is a standalone binary, so we just stage it onto PATH.
common_win_nssm_version: "nssm-2.24"
common_win_nssm_download_url: "https://nssm.cc/release/{{ common_win_nssm_version }}.zip"
common_win_nssm_exe: "C:\\llt\\tools\\nssm.exe"
